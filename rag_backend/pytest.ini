# pytest.ini — rag_backend test configuration
[pytest]
# Project root for imports
pythonpath = .

# Test discovery
testpaths =
    chat/tests
    documents/tests

# Django settings for API-level tests
DJANGO_SETTINGS_MODULE = config.settings

# Output: show short summary with reason
addopts =
    -v
    --tb=short
    --no-header
    -q

# Markers
markers =
    offline: Tests that run with no external services (Ollama, ChromaDB)
    django_db: Tests that require the Django database
    slow: Tests that take > 5 seconds (audio/image processing)
